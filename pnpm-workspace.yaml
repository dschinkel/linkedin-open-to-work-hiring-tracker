allowBuilds:
  # jspdf pulls it in optionally; its install script only prints a funding message.
  core-js: false
  # Its install script only prints a donation message; the library works without it.
  tesseract.js: false
minimumReleaseAgeExclude:
  - cn@0.4.0
ignoredOptionalDependencies:
  # pdfjs-dist only uses it to draw PDFs in Node; the app renders PDF pages in the browser.
  - '@napi-rs/canvas'
