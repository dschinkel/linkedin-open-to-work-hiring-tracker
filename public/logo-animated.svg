<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20.5 99.4 58.4" role="img" aria-label="Open-to-Work and Hiring tracker">
  <style>
    /* Like a traffic-light "go" arrow: squares light up one by one from tail to head, hold, then restart.
       Unlit squares stay faintly visible so the arrow shape always reads. */
    .brick { animation: light-up 5s ease-out infinite both; }
    @keyframes light-up {
      0% { opacity: 0.15; }
      3% { opacity: 1; }
      84% { opacity: 1; }
      92%, 100% { opacity: 0.15; }
    }
    @media (prefers-reduced-motion: reduce) { .brick { animation: none; } }
  </style>
  <rect class="brick" style="animation-delay:0.00s" x="20" y="63.5" width="8.4" height="8.4" rx="1.2" fill="#9B6BFF" />
