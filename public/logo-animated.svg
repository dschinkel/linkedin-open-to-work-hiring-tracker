<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20.5 99.4 58.4" role="img" aria-label="Open-to-Work and Hiring tracker">
  <style>
    /* The green arrow rises and the purple arrow sinks, taking turns. */
    .up { animation: rise 2.4s ease-in-out infinite; }
    .down { animation: sink 2.4s ease-in-out infinite 1.2s; }
    @keyframes rise { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes sink { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) { .up, .down { animation: none; } }
  </style>
  <g class="up">
    <rect x="20" y="27.5" width="8.4" height="8.4" rx="1.2" fill="#22C872" />
    <rect x="11" y="36.5" width="8.4" height="8.4" rx="1.2" fill="#22C872" />
    <rect x="20" y="36.5" width="8.4" height="8.4" rx="1.2" fill="#22C872" />
    <rect x="29" y="36.5" width="8.4" height="8.4" rx="1.2" fill="#22C872" />
    <rect x="2" y="45.5" width="8.4" height="8.4" rx="1.2" fill="#22C872" />
    <rect x="20" y="45.5" width="8.4" height="8.4" rx="1.2" fill="#22C872" />
    <rect x="38" y="45.5" width="8.4" height="8.4" rx="1.2" fill="#22C872" />
    <rect x="20" y="54.5" width="8.4" height="8.4" rx="1.2" fill="#22C872" />
    <rect x="20" y="63.5" width="8.4" height="8.4" rx="1.2" fill="#9B6BFF" />
  </g>
  <g class="down">
    <rect x="71" y="27.5" width="8.4" height="8.4" rx="1.2" fill="#22C872" />
    <rect x="71" y="36.5" width="8.4" height="8.4" rx="1.2" fill="#9B6BFF" />
    <rect x="53" y="45.5" width="8.4" height="8.4" rx="1.2" fill="#9B6BFF" />
    <rect x="71" y="45.5" width="8.4" height="8.4" rx="1.2" fill="#9B6BFF" />
    <rect x="89" y="45.5" width="8.4" height="8.4" rx="1.2" fill="#9B6BFF" />
    <rect x="62" y="54.5" width="8.4" height="8.4" rx="1.2" fill="#9B6BFF" />
    <rect x="71" y="54.5" width="8.4" height="8.4" rx="1.2" fill="#9B6BFF" />
    <rect x="80" y="54.5" width="8.4" height="8.4" rx="1.2" fill="#9B6BFF" />
