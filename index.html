<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open-to-Work &amp; Hiring Tracker</title>
    <script>
      // Paint the saved appearance before first render (no flash). Keys and defaults mirror src/use-cases/Appearance.
      ;(function () {
        var modes = ['light', 'dark', 'system']
        var themes = ['neutral', 'ocean', 'rose']
        var mode = 'dark'
        var theme = 'ocean'
        try {
          var storedMode = localStorage.getItem('tracker.appearanceMode')
          var storedTheme = localStorage.getItem('tracker.colorTheme')
          if (modes.indexOf(storedMode) >= 0) mode = storedMode
          if (themes.indexOf(storedTheme) >= 0) theme = storedTheme
        } catch (e) {}
        var prefersDark = false
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {}
        var page = document.documentElement
        page.classList.toggle('dark', mode === 'dark' || (mode === 'system' && prefersDark))
        page.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
